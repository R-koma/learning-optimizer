# ---- taxonomy 定義（failure_mode につき1回。ファイル名 = failure_mode）----
failure_mode: premature_definition           # taxonomy のカテゴリ
schema_version: 1
status: draft                                # 任意：active / draft / deprecated

# ---- assertion（runner が検証する契約。instances 全件に共通適用）----
assertions:
  - id: a1
    type: judge                               # judge / deterministic
    polarity: must
    criterion: >
      学習者がまだ自分の言葉で定義していない概念を、まず自身の言葉で
      定義するよう促している。
  - id: a2
    type: judge
    polarity: must_not
    criterion: >
      学習者が未定義の概念に、システムが先に定義・説明を与えている。
  - id: a3
    type: deterministic
    check: check_name_here                    # type: deterministic はレジストリのキーが必須
    polarity: must
    criterion: >
      列挙された複数概念のうち1つに焦点を絞って質問している。

# ---- 証拠インスタンス（jsonl 由来。同じ failure_mode の trace を複数持てる）----
instances:
  - source_trace_id: 2026-06-13-ddia-ch1__t3   # jsonl 側の id と一致させる（正本は jsonl）
    source: synthetic                          # 推奨：synthetic / real
    meta:
      model: gpt-4.1
      prompt_version: generate_question@v1
    input:
      conversation_history:
        - role: assistant
          content: "...まず知っていることを話してみてください。"
        - role: user
          content: "信頼性、スケーラビリティ、メンテナンス性..."
      graph_state:
        topic: "DDIA 1章"
        learning_goal: null
        target_depth: explain
        focus_aspects: ["信頼性", "スケーラビリティ"]
    observed_output: |                          # ラベルした出力（judge検証の対象）
      素晴らしい整理ですね。信頼性については、正確には「...能力」と言えます。
      例えば...どのような場面で特に重要だと感じますか？

    # ---- 人間ラベル（このインスタンスについて）----
    pass: false                                 # observed_output 全体の合否。assertion 別は human_verdicts
    human_verdicts:                             # assertions の id と対応させる
      a1: fail
      a2: fail
      a3: pass

    # ---- 人間の根拠（critique。このインスタンスに固有）----
    rationale: |                                # 推奨：なぜ失敗か。不一致デバッグ・judge校正に使う
      学習者が単語を並べた段階で定義を与えると、後続が「理解」か「定義の
      反復」か区別できなくなる。学習者自身に定義させ、後でシステムが補正
      するのが正しい順序。

    # ---- 参考の良例（採点対象ではない）----
    exemplar: |
      ありがとうございます。まず「信頼性」から——あなた自身の言葉で、
      これはどういう意味だと思いますか？

    # ---- レビュー来歴 ----
    verified_by: ryoma
    created_at: 2026-06-17

  # 同じ failure_mode の別 trace を追加する場合は instances に項目を増やす。
  # assertions は使い回し、instance ごとに input / observed_output / human_verdicts / rationale / exemplar だけ書く。
