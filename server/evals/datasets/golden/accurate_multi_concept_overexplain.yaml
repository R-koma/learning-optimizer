failure_mode: accurate_multi_concept_overexplain
schema_version: 1
status: active

assertions:
  - id: a1
    type: judge
    polarity: must
    criterion: >
      列挙された複数概念のうち1つに焦点を絞り、ユーザーがまだ説明していない側面
      （具体例・因果・応用場面など）を引き出す質問をしている。
  - id: a2
    type: judge
    polarity: must_not
    criterion: >
      誤りのない説明に対して、複数の観点へ定義・具体例の解説を与えている。
  - id: a3
    type: judge
    polarity: must_not
    criterion: >
      ユーザーが既に自分の言葉で説明した内容を、そのまま再度説明するよう求めている。
  - id: a4
    type: judge
    polarity: must_not
    criterion: >
      「もし A なら〜 / B が気になる場合は〜」のような条件付きオファーを複数並べて
      ユーザーに方針を選ばせている（メニュー化）。

instances:
  - source_trace_id: 2026-07-08-ddia-ch1-perf__t3
    source: real
    meta:
      model: gpt-4.1
      prompt_version: generate_question@v1
    input:
      conversation_history:
        - role: assistant
          content: "DDIA 1章について学びたいんですね。では、まずあなたが今知っていることを自由に話してみてください。"
        - role: user
          content: >-
            スループットとは、1秒あたりに処理できるレコード数や、あるサイズのデータセットに対して
            1つのジョブを実行するのにかかる合計時間のこと。レイテンシとは、リクエストが処理を
            待っている期間であり、リクエストはこの期間待ち状態。レスポンスタイムはクライアントから
            見た値であり、リクエストの処理そのものに費やされた時間であるサービスタイムに加えて、
            ネットワークやキューイングによる遅延が含まれる。
      graph_state:
        topic: "DDIA 1章"
        target_depth: explain
        focus_aspects: []
    observed_output: |
      素晴らしい整理ですね。3つの概念を正確に押さえられています。
      スループットとは、正確には「単位時間あたりに処理できる仕事量」のことで、例えば1秒あたりの
      レコード処理数や、バッチジョブが一定サイズのデータセットを処理し終えるまでの時間で測ります。
      レイテンシは「リクエストが処理を待っている期間」で、例えばキューでの待機時間が該当します。
      レスポンスタイムは「クライアントから見た応答までの総時間」で、サービスタイムに加えて
      ネットワーク遅延やキューイング遅延が含まれます。例えばWebアプリでは、DBの処理が速くても
      ネットワークが遅いとレスポンスタイムは悪化します。
      それでは、まずスループットについて、もう一度自分の言葉で説明してみてもらえますか？
    pass: false
    human_verdicts:
      a1: fail
      a2: fail
      a3: fail
      a4: pass
    rationale: |
      3観点（スループット / レイテンシ / レスポンスタイム）の定義はすべて正確で、訂正すべき
      誤りがない。ここで AI が全観点に定義+具体例の解説を被せると、ユーザーが自分の言葉で
      深める機会（教えることで学ぶ）を奪う。さらに既に説明済みの観点の再説明を求めており、
      対話が前進しない。正しくは、復唱1文で受け止めた後、1観点に絞って定義の暗記では
      答えられない質問（ばらつきの原因・応用場面など）を1つ出す。
    exemplar: |
      スループット・レイテンシ・レスポンスタイムを、サービスタイムとの関係まで正確に区別
      できていますね。では『レスポンスタイム』に一歩踏み込みます──同じリクエストを何度も
      送ると、レスポンスタイムは毎回同じにならず大きくばらつきます。このばらつきはどこから
      生まれると思いますか？
