failure_mode: self_answered_question
schema_version: 2
status: active

assertions:
  - id: a1
    type: judge
    polarity: must_not
    criterion: >
      ユーザーへの質問に対する答えの中核を、AI が同じ応答内で既に述べている。
      細部が述べられていなくても、中核が述べられていれば含まれる。
  - id: a2
    type: judge
    polarity: must_not
    criterion: >
      ユーザーが正しく述べた内容を、AI が言い直したり補強したりして解説している。
      短い受け止めの復唱と、誤りを訂正するための記述は、これに含まない。
  - id: a3
    type: judge
    polarity: must
    criterion: >
      ユーザーがまだ説明していない側面（仕組み・具体例・因果など）を、1つに絞った
      具体的な質問で引き出している。
  - id: a4
    type: judge
    polarity: must_not
    applies_when: >
      ユーザーの直前の説明に、訂正を要する事実誤認が含まれている。
    criterion: >
      ユーザー発言に含まれる不正確な表現を、訂正せずそのまま追認・復唱している。
  - id: a5
    type: deterministic
    check: contains_generic_prompt_phrase
    check_fingerprint: a9bd66a88432
    polarity: must_not
    criterion: >
      「もっと詳しく」「掘り下げてみませんか」のような、対象を特定しない一般化した促しを含んでいる。

instances:
  - source_trace_id: 2026-07-14-os-process__t1
    source: real
    meta:
      model: gpt-4.1-nano
      prompt_version: generate_question@v1
      params:
        temperature: 0.7
    input:
      conversation_history:
      - role: user
        content: プロセスとは、OSから独立したメモリ空間を割り当てられて動く、プログラムの実行単位である。
      graph_state:
        topic: プロセス
        learning_goal: null
        focus_aspects: []
    observed_output: |-
      プロセスは、コンピュータの中で動作するプログラムの実行単位であり、オペレーティングシステムから独立したメモリ空間を持っていることが特徴です。具体的には、各プロセスは自身のアドレス空間、コード、データ、スタックなどを持ち、他のプロセスと分離されているため、安全に並行して動作できます。これにより、複数のプログラムが同時に実行される環境で、それぞれの動作を独立して管理できる仕組みとなっています。

      この観点から、プロセスの動作の仕組みや、その管理方法について、さらに詳しく説明してみてください。
    pass: false
    human_verdicts:
      a1: fail
      a2: fail
      a3: fail
      a4: fail
      a5: fail
    rationale: |
      ユーザーは単一観点（プロセスの定義）を自分の言葉で述べた段階。ここで AI は
      (1) 定義を言い換え・増強して解説し直し（アドレス空間・コード・データ・スタック、
      分離による並行動作、独立した管理）、(2) その直後に「動作の仕組みや管理方法を
      説明して」と質問した。質問の答えは AI 自身が直前に述べた内容そのものであり、
      ユーザーに残るのは AI の説明の復唱か「さらに詳しく」の範囲の推測だけ。復唱は
      想起・生成を伴わずプロテジェ効果が成立しない。解説を被せた時点で深掘り質問の
      余白を自分で埋めてしまう——overexplain の帰結として必然的に起きる衝突である。
      加えて「OSから独立したメモリ空間」という不正確な表現を訂正せず追認・増幅して
      おり、質問も「仕組み『や』管理方法」と2方向に割れて焦点が絞れていない。良い応答は
      2026-07-14-os-process__t1-exemplar を参照。
    verified_by: R-koma
    created_at: 2026-07-14

  - source_trace_id: 2026-07-14-os-process__t1-exemplar
    source: handwritten
    meta:
      model: human-authored
      prompt_version: null
      params: {}
    input:
      conversation_history:
      - role: user
        content: プロセスとは、OSから独立したメモリ空間を割り当てられて動く、プログラムの実行単位である。
      graph_state:
        topic: プロセス
        learning_goal: null
        focus_aspects: []
    observed_output: プロセスを「独立したメモリ空間を持つプログラムの実行単位」と、要点を押さえて定義できていますね。一点だけ正確に言うと、メモリ空間は OS から独立しているのではなく、OS が各プロセスに割り当てた上で「他のプロセスから」隔離されています。では、その「他のプロセスからの隔離」は、具体的にどのような仕組みで実現されていると思いますか？
    pass: true
    human_verdicts:
      a1: pass
      a2: pass
      a3: pass
      a4: pass
      a5: pass
    rationale: |
      負例と同じ入力に対する正しい応答。誤り（「OSから独立した」）を訂正した上で、
      その訂正が開いた「他のプロセスからの隔離」の仕組みを問うている。仕組み自体は
      応答内で説明していないので、ユーザーは復唱では答えられない。
      a2 は判断が割れうる。訂正のために「OS が割り当てた上で他のプロセスから隔離」と
      述べており、これを「ユーザーの説明の増強」と読めば fail になる。だが a4 が訂正を
      要求している以上、訂正に必要な最小限の記述を a2 の違反とすると両者が矛盾する。
      a2 が禁じているのは訂正ではなく、正しい部分の言い換え・肉付けだと解して pass とした。
    verified_by: R-koma
    created_at: 2026-08-31
