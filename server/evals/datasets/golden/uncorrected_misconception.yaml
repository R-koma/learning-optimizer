      r2: pass
    rationale: |-
      直前のユーザー発話「これらの並行処理と並列処理を駆使して動いています」は訂正を要する。
      並行処理・並列処理は資源管理の結果として実現される状態であって管理の手段ではなく（手段は
      タイマー割り込み・スケジューラ・コンテキストスイッチ）、手段と結果が逆になっている。加えて
      問いが含んでいたメモリの割り当ては並行・並列では説明できない（仮想アドレス空間・ページテーブル・MMU）。

      AI は第一文「あなたの説明から、プロセスの管理について重要なポイントを押さえていますね」で
      この混同をそのまま追認し、訂正しないまま次の質問へ進んだ（a1）。訂正が無いので、訂正した点を
      ユーザーに言い直させる質問も存在しない（a2）。良い応答は 2026-09-17-0f43b9c0__t8-exemplar を参照。

      この発話は直前ターン（2026-09-17-0f43b9c0__t6）の自己回答が生んだもので、AI の
      「複数のプログラムが同時に動作できるように」を専門用語に言い換えた復唱に過ぎない。
      追認の対象が AI 自身の言葉の写しだった、という因果はこの instance だけで見える。

      a3 は pass。末尾の「もう少し具体的に考えてみてもらえますか」は「もっと詳しく」の族に見えるが、
      `contains_generic_prompt_phrase` の語彙はこの語形を持たず、deterministic の人間ラベルは check と
      一致させる規約（`test_golden_deterministic_consistency`）なので pass を採った。語彙に
      「もう少し具体的に」の族を足すなら fail に変わる（check_fingerprint の再転記を伴う）。

      この応答のもう 1 つの欠陥（t6 の質問をほぼ同じ言葉で再提示し、ユーザーが新しく出した
      「並行処理」「並列処理」という足がかりを引用していない）は、この failure_mode の守備範囲外。
      別の failure_mode として assertion を起草してから扱う。
