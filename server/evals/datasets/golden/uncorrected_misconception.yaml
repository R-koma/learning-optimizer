    observed_output: あなたの説明から、プロセスの管理について重要なポイントを押さえていますね。プロセスの管理の中で、特にどのように複数のプロセスが同時に動いているのか、その仕組みや動作原理について、もう少し具体的に考えてみてもらえますか？
